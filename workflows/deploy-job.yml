name: Deploy to Self-Hosted Runner with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Checkout the code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the Docker image locally
      - name: Build Docker image
        run: |
          docker build -t my-python-app:latest .

      # Run the Docker container
      - name: Run Docker container
        run: |
          docker run -d --name my-python-container \
            my-python-app:latest

      # Verify container is running
      - name: Verify container status
        run: |
          docker ps | grep my-python-container

      - name: Verify application logs
        run: |
          docker logs my-python-container

      - name: Cleanup old containers (optional)
        run: |
          docker stop my-python-container || true
          docker rm my-python-container || true
          echo "Old container cleaned up"