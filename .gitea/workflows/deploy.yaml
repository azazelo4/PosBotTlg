name: Deploy Bot to Proxmox
on:
  push:
    branches: [ POS-Bot ]

jobs:
  deploy:
    runs-on: ubuntu-latest  # Используем метку, которую мы настроили
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Create .env file from Secrets
        # Создаем .env файл прямо перед сборкой
        run: |
          umask 077
          cat > .env <<'EOF'
          TOKEN=${{ secrets.TOKEN }}
          DB_HOST=db
          DB_USER=${{ secrets.MYSQL_USER }}
          DB_PASS=${{ secrets.MYSQL_PASSWORD }}
          DB_NAME=${{ secrets.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          REPORT_CHAT_ID=${{ secrets.REPORT_CHAT_ID }}
          EOF

      - name: Deploy to Host Directory
        run: |
          cp -r . /opt/pos-bot/
          cd /opt/pos-bot

          docker compose down --remove-orphans || true
          docker compose up -d --build

          docker image prune -f
