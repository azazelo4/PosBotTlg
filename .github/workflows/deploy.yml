name: Check & Deploy

on:
  push:
    branches: [POS-Bot]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Синтаксис Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: Валидация docker-compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Сборка образа
        run: docker build -t pos-bot:ci .

  test:
    name: Тесты (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "latest"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bot_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Сценарные тесты на реальной БД
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASS: root
          TEST_DB_NAME: bot_test
        run: python -m pytest -q tests

  deploy:
    name: Деплой на сервер
    needs: [check, test]
    # Деплой только из основной ветки, не из PR
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, pos-bot]
    environment: production
    concurrency:
      group: deploy-pos-bot
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/pos-bot
    steps:
      - uses: actions/checkout@v4

      - name: Обновить код в каталоге деплоя
        run: |
          mkdir -p "$DEPLOY_DIR"
          # Только файлы из git: без .git, локального мусора и чужих .env
          git archive HEAD | tar -x -C "$DEPLOY_DIR"

      - name: Сформировать .env из секретов
        env:
          TOKEN: ${{ secrets.TOKEN }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ADMIN_PHONE: ${{ vars.ADMIN_PHONE }}
          REPORT_CHAT_ID: ${{ vars.REPORT_CHAT_ID }}
          TZ: ${{ vars.TZ || 'Asia/Almaty' }}
          DAILY_REPORT_TIME: ${{ vars.DAILY_REPORT_TIME || '23:00' }}
          LOW_STOCK_TIME: ${{ vars.LOW_STOCK_TIME || '09:00' }}
          LOW_STOCK_THRESHOLD: ${{ vars.LOW_STOCK_THRESHOLD || '5' }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_SECRET: ${{ secrets.WEB_SECRET }}
          LABEL_WIDTH_MM: ${{ vars.LABEL_WIDTH_MM || '30' }}
          LABEL_HEIGHT_MM: ${{ vars.LABEL_HEIGHT_MM || '20' }}
          LABEL_TITLE: ${{ vars.LABEL_TITLE }}
          IMPORT_MIN_PRICE_PERCENT: ${{ vars.IMPORT_MIN_PRICE_PERCENT || '100' }}
        run: |
          for v in TOKEN MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE MYSQL_ROOT_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v"; exit 1; fi
          done
          umask 077
          {
            echo "TOKEN=$TOKEN"
            echo "DB_HOST=db"
            echo "DB_USER=$MYSQL_USER"
            echo "DB_PASS=$MYSQL_PASSWORD"
            echo "DB_NAME=$MYSQL_DATABASE"
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
            echo "MYSQL_DATABASE=$MYSQL_DATABASE"
            echo "MYSQL_USER=$MYSQL_USER"
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            echo "ADMIN_PHONE=$ADMIN_PHONE"
            echo "REPORT_CHAT_ID=$REPORT_CHAT_ID"
            echo "TZ=$TZ"
            echo "DAILY_REPORT_TIME=$DAILY_REPORT_TIME"
            echo "LOW_STOCK_TIME=$LOW_STOCK_TIME"
            echo "LOW_STOCK_THRESHOLD=$LOW_STOCK_THRESHOLD"
            echo "LABEL_WIDTH_MM=$LABEL_WIDTH_MM"
            echo "LABEL_HEIGHT_MM=$LABEL_HEIGHT_MM"
            echo "LABEL_TITLE=$LABEL_TITLE"
            echo "IMPORT_MIN_PRICE_PERCENT=$IMPORT_MIN_PRICE_PERCENT"
            if [ -n "$WEB_DOMAIN" ]; then
              # Веб-админка, Mini App и HTTPS-прокси (сервисы web и caddy в docker-compose.yml)
              echo "COMPOSE_PROFILES=web"
              echo "WEB_DOMAIN=$WEB_DOMAIN"
              echo "WEB_URL=https://$WEB_DOMAIN"
              echo "WEB_SECRET=$WEB_SECRET"
            fi
          } > "$DEPLOY_DIR/.env"

      - name: Перезапустить контейнеры
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Проверить, что бот запустился
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          sleep 15
          docker compose ps
          status=$(docker inspect -f '{{.State.Status}}' PosBotTest)
          if [ "$status" != "running" ]; then
            docker compose logs --tail=100 bot
            echo "::error::Контейнер бота в состоянии $status"
            exit 1
          fi
          docker compose logs --tail=30 bot
          if grep -q '^COMPOSE_PROFILES=web' .env; then
            web_ok=""
            for i in $(seq 1 10); do
              if docker compose exec -T web python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"; then
                web_ok=1; break
              fi
              sleep 3
            done
            if [ -z "$web_ok" ]; then
              docker compose logs --tail=100 web
              echo "::error::Веб-админка не отвечает"
              exit 1
            fi
            echo "Веб-админка: https://$(grep -m1 '^WEB_DOMAIN=' .env | cut -d= -f2-)"
          fi
