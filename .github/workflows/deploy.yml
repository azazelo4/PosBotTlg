name: Check & Deploy

on:
  push:
    branches: [POS-Bot]
    # Тег версии (v1.2.3) публикует образ для клиентов: теги 1.2.3, 1.2 и latest
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Синтаксис Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: Валидация docker-compose и Caddyfile
        run: |
          cp .env.example .env
          docker compose config -q
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Скрипты деплоя (shellcheck)
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/*.sh

      - name: Валидация compose для установки из образа
        # Как у клиента: файл лежит в каталоге установки рядом с .env
        run: |
          mkdir -p /tmp/posbot && cp deploy/compose.prod.yml /tmp/posbot/docker-compose.yml && cp .env.example /tmp/posbot/.env
          docker compose --project-directory /tmp/posbot config -q

      - name: Сборка образа
        run: docker build -t pos-bot:ci .

  install:
    name: Установка на чистый сервер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build --build-arg POSBOT_VERSION=ci -t posbot-local:ci .

      - name: Установка (как у клиента, без переменных и секретов)
        run: sudo bash deploy/install.sh --yes --skip-system --no-pull --image posbot-local --version ci --domain shop.example.kz | tee install.log

      - name: Проверка результата
        run: |
          set -x
          grep -q "https://shop.example.kz/setup" install.log
          grep -Eq "Код настройки: [A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}" install.log
          curl -fsS http://127.0.0.1:8000/health | grep -q '"configured":false'
          curl -fsS http://127.0.0.1:8000/setup | grep -q "Первоначальная настройка"
          sudo stat -c %a /opt/posbot/.env | grep -qx 600
          sudo docker compose -f /opt/posbot/docker-compose.yml logs bot | grep -q "ожидает настройки"
          # Caddy разрешает сертификат только до настройки и не для IP
          sudo docker compose -f /opt/posbot/docker-compose.yml exec -T web python -c "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/caddy/ask?domain=shop.example.kz')"

      - name: Повторная установка ничего не ломает
        run: |
          before=$(sudo grep -E '^(MYSQL_PASSWORD|POSBOT_MASTER_KEY)=' /opt/posbot/.env)
          code1=$(sudo posbot setup-code | head -1)
          sudo bash deploy/install.sh --yes --skip-system --no-pull --image posbot-local --version ci --domain shop.example.kz
          [ "$before" = "$(sudo grep -E '^(MYSQL_PASSWORD|POSBOT_MASTER_KEY)=' /opt/posbot/.env)" ]
          [ "$code1" = "$(sudo posbot setup-code | head -1)" ]

      - name: posbot backup / update / restore
        run: |
          sudo posbot status
          sudo posbot backup
          file=$(sudo ls -1t /opt/pos-bot-backups/ | head -1)
          sudo POSBOT_NO_PULL=1 posbot update ci
          sudo POSBOT_YES=1 posbot restore "/opt/pos-bot-backups/$file"
          curl -fsS http://127.0.0.1:8000/health | grep -q '"version":"ci"'
          sudo posbot version

      - name: Логи при ошибке
        if: failure()
        run: sudo docker compose -f /opt/posbot/docker-compose.yml logs --tail=100 || true

  install-local:
    name: Установка на ПК без белого IP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build --build-arg POSBOT_VERSION=ci -t posbot-local:ci .

      - name: Установка --local (без домена, Caddy и портов 80/443)
        run: sudo bash deploy/install.sh --yes --skip-system --no-pull --image posbot-local --version ci --local | tee install.log

      - name: Проверка результата
        run: |
          set -x
          ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          grep -q "http://$ip:8000/setup" install.log
          grep -Eq "Код настройки: [A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}" install.log
          grep -q "копия бэкапов вне ПК НЕ настроена" install.log
          curl -fsS "http://$ip:8000/health" | grep -q '"mode":"local"'
          curl -fsS "http://$ip:8000/setup" | grep -q "value=\"http://$ip:8000\""
          sudo grep -qx "COMPOSE_PROFILES=" /opt/posbot/.env
          [ -z "$(sudo docker ps -q --filter name=caddy)" ]
          ! sudo ss -ltn | grep -Eq ':(80|443) '
          sudo posbot status | tee status.txt
          grep -q "Режим: local" status.txt
          grep -q "Копия вне ПК: НЕ НАСТРОЕНА" status.txt
          ! sudo posbot status --check >/dev/null

      - name: Копия бэкапа вне ПК по SSH
        run: |
          set -x
          sudo systemctl start ssh || sudo systemctl start sshd
          sudo posbot offsite "ssh://$USER@127.0.0.1/tmp/offsite" | tee offsite.log
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          sudo cat /root/.ssh/posbot_backup.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo posbot backup
          ls /tmp/offsite/*.sql.gz
          sudo posbot status | tee status.txt
          grep -q "Копия вне ПК: ssh://$USER@127.0.0.1/tmp/offsite, последняя только что" status.txt
          # Свежий бэкап есть — --if-stale ничего не делает
          n=$(sudo ls /opt/pos-bot-backups/*.sql.gz | wc -l)
          sudo APP_DIR=/opt/posbot /opt/posbot/deploy/backup.sh --if-stale 20
          [ "$n" = "$(sudo ls /opt/pos-bot-backups/*.sql.gz | wc -l)" ]

      - name: Туннель Cloudflare включается и выключается
        run: |
          set -x
          sudo posbot tunnel cloudflare ci-fake-token
          sudo grep -qx "COMPOSE_PROFILES=tunnel" /opt/posbot/.env
          sudo docker compose -f /opt/posbot/docker-compose.yml config --services | grep -qx tunnel
          sudo posbot tunnel off
          sudo grep -qx "COMPOSE_PROFILES=" /opt/posbot/.env
          [ -z "$(sudo docker ps -q --filter name=tunnel)" ]

      - name: Повторная установка сохраняет режим и пароли
        run: |
          before=$(sudo grep -E '^(MYSQL_PASSWORD|POSBOT_MASTER_KEY)=' /opt/posbot/.env)
          sudo bash deploy/install.sh --yes --skip-system --no-pull --image posbot-local --version ci
          [ "$before" = "$(sudo grep -E '^(MYSQL_PASSWORD|POSBOT_MASTER_KEY)=' /opt/posbot/.env)" ]
          curl -fsS http://127.0.0.1:8000/health | grep -q '"mode":"local"'
          sudo POSBOT_NO_PULL=1 posbot update ci
          sudo grep -qx "POSBOT_MODE=local" /opt/posbot/.env

      - name: Логи при ошибке
        if: failure()
        run: sudo docker compose -f /opt/posbot/docker-compose.yml logs --tail=100 || true

  publish:
    name: Публикация образа
    needs: [check, test, install, install-local]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/azazelo4/posbottlg
          # Ветка POS-Bot → edge и sha-…; тег v1.2.3 → 1.2.3, 1.2 и latest (их ставят клиенты)
          tags: |
            type=edge,branch=POS-Bot
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: POSBOT_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Тесты (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "latest"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bot_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q fonts-dejavu-core zbar-tools poppler-utils >/dev/null
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Сценарные тесты на реальной БД
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASS: root
          TEST_DB_NAME: bot_test
        run: python -m pytest -q tests

  deploy:
    name: Деплой на сервер
    needs: [check, test]
    # Деплой только из основной ветки: не из PR и не по тегу версии
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/POS-Bot'
    runs-on: [self-hosted, linux, pos-bot]
    environment: production
    concurrency:
      group: deploy-pos-bot
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/pos-bot
    steps:
      - uses: actions/checkout@v4

      - name: Обновить код в каталоге деплоя
        run: |
          mkdir -p "$DEPLOY_DIR"
          # Только файлы из git: без .git, локального мусора и чужих .env
          git archive HEAD | tar -x -C "$DEPLOY_DIR"

      - name: Подготовить .env (пароли БД генерируются один раз)
        # Секреты и переменные репозитория больше не обязательны: токен, магазины и остальное
        # задаются в мастере /setup. Если они заданы (старые установки) — переносятся в .env.
        env:
          OVERRIDE_TOKEN: ${{ secrets.TOKEN }}
          OVERRIDE_MYSQL_USER: ${{ secrets.MYSQL_USER }}
          OVERRIDE_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          OVERRIDE_MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          OVERRIDE_MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          OVERRIDE_WEB_SECRET: ${{ secrets.WEB_SECRET }}
          OVERRIDE_ADMIN_PHONE: ${{ vars.ADMIN_PHONE }}
          OVERRIDE_REPORT_CHAT_ID: ${{ vars.REPORT_CHAT_ID }}
          OVERRIDE_TZ: ${{ vars.TZ }}
          OVERRIDE_DAILY_REPORT_TIME: ${{ vars.DAILY_REPORT_TIME }}
          OVERRIDE_LOW_STOCK_TIME: ${{ vars.LOW_STOCK_TIME }}
          OVERRIDE_LOW_STOCK_THRESHOLD: ${{ vars.LOW_STOCK_THRESHOLD }}
          OVERRIDE_WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          OVERRIDE_LABEL_WIDTH_MM: ${{ vars.LABEL_WIDTH_MM }}
          OVERRIDE_LABEL_HEIGHT_MM: ${{ vars.LABEL_HEIGHT_MM }}
          OVERRIDE_LABEL_TITLE: ${{ vars.LABEL_TITLE }}
          OVERRIDE_IMPORT_MIN_PRICE_PERCENT: ${{ vars.IMPORT_MIN_PRICE_PERCENT }}
        run: bash "$DEPLOY_DIR/deploy/bootstrap-env.sh" "$DEPLOY_DIR/.env"

      - name: Перезапустить контейнеры
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Проверить, что всё запустилось
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          sleep 15
          docker compose ps
          for svc in PosBotTest PosBotWeb; do
            status=$(docker inspect -f '{{.State.Status}}' "$svc")
            if [ "$status" != "running" ]; then
              docker logs --tail=100 "$svc"
              echo "::error::Контейнер $svc в состоянии $status"
              exit 1
            fi
          done
          health=""
          for i in $(seq 1 20); do
            if health=$(docker compose exec -T web python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"); then
              break
            fi
            health=""
            sleep 3
          done
          if [ -z "$health" ]; then
            docker compose logs --tail=100 web
            echo "::error::Веб-админка не отвечает"
            exit 1
          fi
          docker compose logs --tail=30 bot
          # Не настроено — это нормальное состояние после первого деплоя, а не ошибка
          if echo "$health" | grep -q '"configured":false'; then
            {
              echo "### Требуется первоначальная настройка"
              echo ""
              echo "Откройте https://<ваш-домен>/setup (A-запись домена → IP сервера)"
              echo "или через SSH-туннель: \`ssh -L 8000:127.0.0.1:8000 <сервер>\` → http://127.0.0.1:8000/setup"
              echo ""
              echo "Код настройки покажет команда на сервере:"
              echo "\`docker compose -f $DEPLOY_DIR/docker-compose.yml exec web python -m setup_code\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Бот ждёт первоначальной настройки: откройте /setup (подробности — в Summary этого запуска)."
          else
            echo "Бот настроен и работает."
          fi
