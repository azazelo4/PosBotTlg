name: Deploy to Self-Hosted Runner with Docker

on:
  push:
    branches:
      - POS-Bot
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, secondary]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add current user to docker group
        run: |
          if ! groups $USER | grep &>/dev/null '\bdocker\b'; then
            sudo usermod -aG docker $USER
            newgrp docker
          else
            echo "User is already in the docker group"
          fi

      - name: Stop existing containers
        run: |
          existing_containers=$(docker ps -q --filter "name=PosBotTest")
          if [ -n "$existing_containers" ]; then
            docker stop $existing_containers
            docker rm $existing_containers
          else
            echo "No existing containers to stop"
          fi

      - name: Deploy with Docker Compose
        run: |
          docker-compose up -d --build

      - name: Verify services
        run: |
          docker ps