version: '3.8'

services:
  bot:
    build: .
    container_name: PosBotTest
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mariadb:latest
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data: