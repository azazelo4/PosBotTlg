services:
  bot:
    build: .
    container_name: PosBotTest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Almaty}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: mysql:latest
    container_name: mysql-db
    restart: always
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - db_data:/var/lib/mysql
    # Схему создаёт и обновляет сам бот при старте (schema.py), init.sql больше не нужен
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Порт MySQL наружу не публикуется: бот ходит в БД по внутренней сети compose.
    # Для доступа с хоста раскомментируйте (только localhost):
    # ports:
    #   - "127.0.0.1:3306:3306"

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"  # Adminer только с хоста (через SSH-туннель)

volumes:
  db_data:
