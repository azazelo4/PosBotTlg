services:
  bot:
    build: .
    image: posbot-app
    container_name: PosBotTest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Almaty}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Веб-админка и Telegram Mini App. Включаются профилем web (COMPOSE_PROFILES=web в .env)
  web:
    build: .
    image: posbot-app
    container_name: PosBotWeb
    restart: always
    profiles: ["web"]
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Almaty}
    logging: *logging

  caddy:
    image: caddy:2
    container_name: PosBotCaddy
    restart: always
    profiles: ["web"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  db:
    image: mysql:latest
    container_name: mysql-db
    restart: always
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - db_data:/var/lib/mysql
    # Схему создаёт и обновляет сам бот при старте (schema.py), init.sql больше не нужен
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Порт MySQL наружу не публикуется: бот ходит в БД по внутренней сети compose.
    # Для доступа с хоста раскомментируйте (только localhost):
    # ports:
    #   - "127.0.0.1:3306:3306"

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"  # Adminer только с хоста (через SSH-туннель)

volumes:
  db_data:
  caddy_data:
  caddy_config:
